name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the APK to (a release is created when omitted)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-release-signing
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || format('android-build-{0}', github.run_number) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android API 36 build tools
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Bubblewrap SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF
          test "$(jq -r '.androidSdkPath' "$HOME/.bubblewrap/config.json")" = "/usr/local/lib/android/sdk"

      - name: Restore persistent release signing identity
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: .android-signing
          key: reelbag-android-release-signing-v1

      - name: Generate or load release signing key
        id: signing
        run: |
          mkdir -p .android-signing
          if [ ! -s .android-signing/release.keystore ] || [ ! -s .android-signing/password ]; then
            password="$(openssl rand -hex 24)"
            keytool -genkeypair \
              -keystore .android-signing/release.keystore \
              -storetype PKCS12 \
              -storepass "$password" \
              -keypass "$password" \
              -alias reelbag \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Reelbag, OU=Android, O=Reelbag, L=Unknown, ST=Unknown, C=US"
            printf '%s' "$password" > .android-signing/password
          fi
          password="$(cat .android-signing/password)"
          echo "::add-mask::$password"
          cp .android-signing/release.keystore android/release.keystore
          chmod 600 android/release.keystore
          fingerprint="$(keytool -list -v \
            -keystore android/release.keystore \
            -alias reelbag \
            -storepass "$password" | \
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEY_ALIAS=reelbag" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Save new release signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .android-signing
          key: reelbag-android-release-signing-v1

      - name: Publish signing certificate fingerprint
        env:
          CERT_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          jq --arg fingerprint "$CERT_FINGERPRINT" \
            '.sha256_cert_fingerprint = $fingerprint' \
            android/signing-certificate.json > android/signing-certificate.next.json
          mv android/signing-certificate.next.json android/signing-certificate.json
          if git diff --quiet -- android/signing-certificate.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/signing-certificate.json
          git commit -m "Update Android signing certificate fingerprint"
          git push origin HEAD:main

      - name: Set Android build version
        env:
          CERT_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          jq \
            --arg version "1.0.${VERSION_CODE}" \
            --argjson code "$VERSION_CODE" \
            --arg fingerprint "$CERT_FINGERPRINT" \
            '.appVersion = $version | .appVersionCode = $code | .fingerprints = [{name: "release", value: $fingerprint}]' \
            android/twa-manifest.json > android/twa-manifest.next.json
          mv android/twa-manifest.next.json android/twa-manifest.json

      - name: Generate Android wrapper
        run: >-
          npx --yes @bubblewrap/cli@1.27.0 update
          --skipVersionUpgrade
          --directory="$GITHUB_WORKSPACE/android"
          --manifest="$GITHUB_WORKSPACE/android/twa-manifest.json"

      - name: Pin generated Android SDK levels
        run: |
          sed -i -E \
            -e 's/compileSdkVersion [0-9]+/compileSdkVersion 36/' \
            -e 's/targetSdkVersion [0-9]+/targetSdkVersion 36/' \
            android/app/build.gradle
          grep -q 'compileSdkVersion 36' android/app/build.gradle
          grep -q 'targetSdkVersion 36' android/app/build.gradle
          grep -q 'minSdkVersion 24' android/app/build.gradle

      - name: Verify deployed Digital Asset Links
        env:
          CERT_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          actual="$(printf '%s' "$CERT_FINGERPRINT" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          for attempt in $(seq 1 18); do
            response="$(curl --fail --silent --show-error \
              https://reelbag.vercel.app/.well-known/assetlinks.json || true)"
            deployed="$(printf '%s' "$response" | jq -r \
              'map(select(.target.package_name == "app.vercel.reelbag.twa")) | .[0].target.sha256_cert_fingerprints[0] // empty' \
              2>/dev/null || true)"
            expected="$(printf '%s' "$deployed" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [ -n "$expected" ] && [ "$actual" = "$expected" ]; then
              exit 0
            fi
            echo "Waiting for Vercel to deploy the signing certificate (attempt ${attempt}/18)..."
            sleep 10
          done
          echo "Deployed Digital Asset Links fingerprint does not match the signing key." >&2
          exit 1

      - name: Build signed release APK
        working-directory: android
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF
          npx --yes @bubblewrap/cli@1.27.0 build \
            --skipPwaValidation \
            --manifest="$GITHUB_WORKSPACE/android/twa-manifest.json" \
            --signingKeyPath="$GITHUB_WORKSPACE/android/release.keystore" \
            --signingKeyAlias="$ANDROID_KEY_ALIAS"
          cp app-release-signed.apk "$GITHUB_WORKSPACE/Reelbag-Android.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reelbag-Android-APK
          path: Reelbag-Android.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Reelbag Android ${{ env.RELEASE_TAG }}
          generate_release_notes: ${{ github.event_name == 'workflow_dispatch' }}
          files: Reelbag-Android.apk
          fail_on_unmatched_files: true
