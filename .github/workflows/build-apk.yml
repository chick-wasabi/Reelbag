name: Build Native Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the APK to (a release is created when omitted)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-native-release-signing
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || format('android-native-{0}', github.run_number) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Initialize Capacitor and add Android
        run: |
          if [ ! -f capacitor.config.ts ]; then
            npx cap init Reelbag app.vercel.reelbag.mobile --web-dir public
          fi
          npx cap add android
          npx cap sync android

      - name: Set Android package and SDK levels
        run: |
          sed -i -E \
            -e 's/namespace "[^"]+"/namespace "app.vercel.reelbag.mobile"/' \
            -e 's/applicationId "[^"]+"/applicationId "app.vercel.reelbag.mobile"/' \
            -e 's/compileSdk rootProject\.ext\.compileSdkVersion/compileSdkVersion 36/' \
            -e 's/minSdkVersion rootProject\.ext\.minSdkVersion/minSdkVersion 24/' \
            -e 's/targetSdkVersion rootProject\.ext\.targetSdkVersion/targetSdkVersion 36/' \
            android/app/build.gradle
          grep -q 'namespace "app.vercel.reelbag.mobile"' android/app/build.gradle
          grep -q 'applicationId "app.vercel.reelbag.mobile"' android/app/build.gradle
          grep -q 'compileSdkVersion 36' android/app/build.gradle
          grep -q 'minSdkVersion 24' android/app/build.gradle
          grep -q 'targetSdkVersion 36' android/app/build.gradle

      - name: Restore persistent release signing identity
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: .android-signing
          key: reelbag-android-release-signing-v1

      - name: Generate or load release signing key
        run: |
          mkdir -p .android-signing
          if [ ! -s .android-signing/release.keystore ] || [ ! -s .android-signing/password ]; then
            password="$(openssl rand -hex 24)"
            keytool -genkeypair \
              -keystore .android-signing/release.keystore \
              -storetype PKCS12 \
              -storepass "$password" \
              -keypass "$password" \
              -alias reelbag \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Reelbag, OU=Android, O=Reelbag, L=Unknown, ST=Unknown, C=US"
            printf '%s' "$password" > .android-signing/password
          fi
          password="$(cat .android-signing/password)"
          echo "::add-mask::$password"
          echo "REELBAG_KEYSTORE_PATH=$GITHUB_WORKSPACE/.android-signing/release.keystore" >> "$GITHUB_ENV"
          echo "REELBAG_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "REELBAG_KEY_ALIAS=reelbag" >> "$GITHUB_ENV"
          echo "REELBAG_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Save new release signing identity
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .android-signing
          key: reelbag-android-release-signing-v1

      - name: Configure release signing
        run: |
          sed -i -E \
            -e "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" \
            -e "s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" \
            android/app/build.gradle
          cat > android/app/release-signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("REELBAG_KEYSTORE_PATH"))
                      storePassword System.getenv("REELBAG_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("REELBAG_KEY_ALIAS")
                      keyPassword System.getenv("REELBAG_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          printf '\n%s\n' "apply from: 'release-signing.gradle'" >> android/app/build.gradle

      - name: Build signed native APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Reelbag-Native-App.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reelbag-Native-App
          path: Reelbag-Native-App.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Reelbag Native Android ${{ env.RELEASE_TAG }}
          generate_release_notes: ${{ github.event_name == 'workflow_dispatch' }}
          files: Reelbag-Native-App.apk
          fail_on_unmatched_files: true
