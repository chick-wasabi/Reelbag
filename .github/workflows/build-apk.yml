name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the APK to (a release is created when omitted)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.event.release.tag_name || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || format('android-build-{0}', github.run_number) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android API 36 build tools
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          jq -n \
            --arg jdk "$JAVA_HOME" \
            --arg sdk "$ANDROID_HOME" \
            '{jdkPath: $jdk, androidSdkPath: $sdk}' \
            > "$HOME/.bubblewrap/config.json"

      - name: Restore and verify release signing key
        id: signing
        env:
          ANDROID_CERT_SHA256_FINGERPRINT: ${{ vars.ANDROID_CERT_SHA256_FINGERPRINT }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_CERT_SHA256_FINGERPRINT"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          chmod 600 android/release.keystore
          fingerprint="$(keytool -list -v \
            -keystore android/release.keystore \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD | \
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test -n "$fingerprint"
          actual="$(printf '%s' "$fingerprint" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$ANDROID_CERT_SHA256_FINGERPRINT" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$expected" ]; then
            echo "Release certificate does not match ANDROID_CERT_SHA256_FINGERPRINT." >&2
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Set Android build version
        env:
          CERT_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          jq \
            --arg version "1.0.${VERSION_CODE}" \
            --argjson code "$VERSION_CODE" \
            --arg fingerprint "$CERT_FINGERPRINT" \
            '.appVersion = $version | .appVersionCode = $code | .fingerprints = [{name: "release", value: $fingerprint}]' \
            android/twa-manifest.json > android/twa-manifest.next.json
          mv android/twa-manifest.next.json android/twa-manifest.json

      - name: Generate Android wrapper
        run: >-
          bubblewrap update
          --skipVersionUpgrade
          --directory="$GITHUB_WORKSPACE/android"
          --manifest="$GITHUB_WORKSPACE/android/twa-manifest.json"

      - name: Pin generated Android SDK levels
        run: |
          sed -i -E \
            -e 's/compileSdkVersion [0-9]+/compileSdkVersion 36/' \
            -e 's/targetSdkVersion [0-9]+/targetSdkVersion 36/' \
            android/app/build.gradle
          grep -q 'compileSdkVersion 36' android/app/build.gradle
          grep -q 'targetSdkVersion 36' android/app/build.gradle
          grep -q 'minSdkVersion 24' android/app/build.gradle

      - name: Verify deployed Digital Asset Links
        env:
          CERT_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            https://reelbag.vercel.app/.well-known/assetlinks.json)"
          deployed="$(printf '%s' "$response" | jq -r \
            'map(select(.target.package_name == "app.vercel.reelbag.twa")) | .[0].target.sha256_cert_fingerprints[0] // empty')"
          actual="$(printf '%s' "$CERT_FINGERPRINT" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$deployed" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "Deployed Digital Asset Links fingerprint does not match the signing key." >&2
            exit 1
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$BUBBLEWRAP_KEY_PASSWORD"
          bubblewrap build \
            --skipPwaValidation \
            --manifest="$GITHUB_WORKSPACE/android/twa-manifest.json" \
            --signingKeyPath="$GITHUB_WORKSPACE/android/release.keystore" \
            --signingKeyAlias="$ANDROID_KEY_ALIAS"
          cp app-release-signed.apk "$GITHUB_WORKSPACE/Reelbag-Android.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reelbag-Android-APK
          path: Reelbag-Android.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Reelbag Android ${{ env.RELEASE_TAG }}
          generate_release_notes: ${{ github.event_name == 'workflow_dispatch' }}
          files: Reelbag-Android.apk
          fail_on_unmatched_files: true
