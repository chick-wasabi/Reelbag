<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Reelbag</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b0f17;
        color: #f8fafc;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: radial-gradient(circle at top, #172033, #0b0f17 60%);
      }

      main {
        max-width: 24rem;
        padding: 2rem;
        text-align: center;
      }

      strong {
        color: #b5f36d;
        font-size: 1.75rem;
      }

      p {
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>Reelbag.</strong>
      <p>Connect to the internet to open your synced Reel library.</p>
    </main>
  </body>
</html>
